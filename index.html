<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Endix Coverage Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap">
<style>
/* Layout: summary first. One hero, one KPI strip, a highlight rail, then a grid of channel cards; every long list opens in a panel instead of scrolling the page. */
:root{
  --bg:#2a2930;
  --panel:#35343c;
  --panel-2:#3f3e47;
  --line:#4a4853;
  --fg:#f6f4fa;
  --muted:#bdb8c8;
  --faint:#8f8a9b;
  --pink:#ff3fa4;
  --pink-soft:#ff3fa41c;
  --violet:#9c7dff;
  --cyan:#55e3f0;
  --display:"Orbitron","Arial Black",system-ui,sans-serif;
  --body:"Rajdhani","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 72px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:14px}.logo img{display:block;height:38px;width:auto}
.logo i{font-style:normal;color:var(--pink)}
.logo small{font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
@media (max-width:420px){.logo small{display:none}}
.meta a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}.meta a:hover{color:var(--fg);text-decoration-color:var(--pink)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:16px;padding:7px 16px;border-radius:999px;cursor:pointer;letter-spacing:.03em}
.tab[aria-selected="true"]{background:var(--pink);color:#18030e}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:44px 28px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:14px;color:var(--pink)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,5vw,54px);line-height:1.05;margin:8px 0 12px;text-wrap:balance;letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-weight:600}
.meta b{color:var(--fg)}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-weight:700;font-size:15px;color:var(--cyan);background:#55e3f014;border:1px solid #55e3f040;border-radius:999px;padding:4px 12px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan)}
.movie{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);text-decoration:none;
  background:radial-gradient(120% 90% at 85% 10%,#ff3fa455,transparent 55%),radial-gradient(90% 80% at 10% 100%,#9c7dff55,transparent 60%),repeating-linear-gradient(115deg,#ffffff06 0 2px,transparent 2px 14px),var(--panel)}
.movie .mt{position:absolute;left:20px;bottom:18px;right:20px}
.movie .mt b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(16px,2.2vw,22px);letter-spacing:.04em}
.movie .mt span{color:var(--muted);font-weight:600}
.play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:var(--pink);display:grid;place-items:center;box-shadow:0 0 0 10px #ff3fa430}
.play::after{content:"";margin-left:6px;border-style:solid;border-width:14px 0 14px 22px;border-color:transparent transparent transparent #18030e}
.movie:hover .play{transform:scale(1.06)}
.movie.embed{background:#000}.movie.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tweets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
/* every post gets the same frame; long ones fade out and link to X */
.tw{position:relative;height:470px;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:var(--panel);color-scheme:light;isolation:isolate}
.tw .twitter-tweet{margin:-1px!important}
.tw iframe{border-radius:16px!important;color-scheme:light}
.tw .more{position:absolute;left:0;right:0;bottom:0;z-index:2;display:none;padding:60px 16px 14px;text-align:center;text-decoration:none;font-weight:700;color:var(--fg);background:linear-gradient(transparent,var(--panel) 62%)}
.tw .more span{display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2)}
.tw .more:hover span{border-color:var(--pink)}
.tw.long .more{display:block}
@media (max-width:560px){.movie:not(.embed){aspect-ratio:auto;min-height:240px}.play{inset:22px 0 auto 0;width:64px;height:64px}}
.movie.empty{display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:600;padding:20px}
.movie.empty .play{position:static;margin:0 auto 12px;background:var(--panel-2);box-shadow:none}
.movie.empty .play::after{border-color:transparent transparent transparent var(--faint)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.kpi{padding:20px 22px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,38px);line-height:1.1}
.kpi .l{color:var(--muted);font-weight:600;margin-top:6px;line-height:1.25}
.kpi .s{color:var(--faint);font-size:15px;margin-top:4px}
.kpi.lead .v{color:var(--pink)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}

section{padding-block:52px 0}
.sh{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.6vw,28px);margin:0;letter-spacing:.02em}
.sub{color:var(--muted);margin:6px 0 0;max-width:64ch}

/* highlight rail */
.rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.rail{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.rail{grid-template-columns:minmax(0,1fr)}}
.hl{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;min-width:0}
.hl:hover{border-color:var(--pink)}

.hl .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hl .v{font-family:var(--display);font-weight:800;font-size:22px}
.hl .v small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:600;margin-left:6px}
.hl .t{font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hl .by{color:var(--muted);font-weight:600;font-size:16px;margin-top:auto}

/* platform pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ico::before{display:none}.pill svg{width:14px;height:14px;fill:currentColor;flex:none}
/* platform colours on the cards (official brand colours) */
.b-youtube{--brand:#ff0000}.b-tiktok{--brand:#000}.b-x{--brand:#000}.b-media{--brand:#ff0000}.b-twitch{--brand:#9146ff}.b-press{--brand:#ffd166}.b-steam{--brand:#66c0f4}
.hl[class*="b-"],.card[class*="b-"]{transition:border-color .15s,box-shadow .15s}
.hl[class*="b-"]:hover,.hl[class*="b-"]:focus-visible,.card[class*="b-"]:hover{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.hl.b-instagram:hover,.hl.b-instagram:focus-visible,.card.b-instagram:hover{border-color:transparent;box-shadow:none;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5) border-box}
.p-youtube{color:#ff6b6b;border-color:#ff6b6b44}
.p-tiktok{color:var(--cyan);border-color:#55e3f044}
.p-instagram{color:#ff9ad5;border-color:#ff9ad544}
.p-x{color:#e9e5f2;border-color:#e9e5f244}
.p-press{color:#ffd166;border-color:#ffd16644}
.p-twitch{color:#b69bff;border-color:#b69bff44}
.p-steam{color:#9fd3ff;border-color:#9fd3ff44}
.p-media{color:#ffb38a;border-color:#ffb38a44}

/* channel cards */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--panel);min-width:0}
.card.wide{grid-column:span 2}
@media (max-width:620px){.card.wide{grid-column:auto}}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px 0}
.ch h3{margin:0;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.big{padding:12px 20px 0;font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1}
.big small{display:block;font-family:var(--body);font-size:16px;font-weight:600;color:var(--muted);margin-top:4px}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 20px 4px}
.mini b{display:block;font-family:var(--display);font-size:17px;font-weight:700}
.mini span{color:var(--faint);font-size:14px;font-weight:600}
.top3{list-style:none;margin:10px 0 0;padding:0 8px;display:grid}
.top3 li a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 12px;border-radius:8px;text-decoration:none}
.top3 li a:hover{background:var(--panel-2)}
.top3 .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top3 .b{color:var(--faint);font-size:15px;grid-column:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top3 .v{grid-column:2;grid-row:1/3;align-self:center;font-weight:700;color:var(--muted)}
.cf{margin-top:auto;padding:12px 20px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cf .note{color:var(--faint);font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;letter-spacing:.02em}
.btn:hover{border-color:var(--pink)}
.empty-c{padding:14px 20px;color:var(--muted)}

/* country + language bars */
.bars{display:grid;gap:7px;padding:12px 20px 4px}
.bar-r{display:grid;grid-template-columns:130px minmax(0,1fr) 34px;gap:10px;align-items:center;font-weight:600;font-size:16px}
.track{height:8px;background:var(--panel-2);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--violet);border-radius:999px}
.bar-r:first-child .fill{background:var(--pink)}


/* what people are saying: rotating spotlight + two counter-scrolling rows */
.buzz{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:
  radial-gradient(70% 120% at 0% 0%,#ff3fa422,transparent 60%),radial-gradient(60% 120% at 100% 100%,#9c7dff22,transparent 60%),var(--panel)}
.spot{position:relative;padding:clamp(24px,4vw,44px) clamp(20px,4vw,48px) 22px;min-height:230px;display:grid;align-content:center}
.spot .qm{position:absolute;top:-18px;left:clamp(10px,2.5vw,30px);font-family:var(--display);font-weight:900;font-size:150px;line-height:1;color:var(--pink);opacity:.9;
  text-shadow:0 0 28px #ff3fa4aa,0 0 60px #ff3fa455;pointer-events:none;user-select:none}
.spot-i{position:relative;margin:0;max-width:62rem}
.spot-i blockquote{margin:0;font-family:var(--body);font-weight:700;font-size:clamp(24px,3.4vw,40px);line-height:1.18;text-wrap:balance}
.spot-i blockquote.long{font-size:clamp(20px,2.4vw,28px);line-height:1.25}
@media (max-width:560px){.spot{padding-top:64px}.spot .qm{font-size:110px;top:-12px}}
.spot-i figcaption{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.spot-i .who{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.spot-i a.read{font-weight:700;font-size:16px;color:var(--pink);text-decoration:none}
.spot-i a.read:hover{text-decoration:underline}
.spot-i.in{animation:spotIn .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes spotIn{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.spot-nav{display:flex;align-items:center;gap:6px;margin-top:22px;flex-wrap:wrap}
.spot-nav button{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.spot-nav button::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.spot-nav button[aria-current="true"]::after{background:var(--pink);transform:scale(1.35);box-shadow:0 0 10px var(--pink)}
.spot-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--pink),var(--violet));transform-origin:left;transform:scaleX(0)}
.spot-bar.run{animation:spotBar var(--dur,6s) linear both}
.buzz:hover .spot-bar.run,.buzz:focus-within .spot-bar.run{animation-play-state:paused}
@keyframes spotBar{to{transform:scaleX(1)}}
.rows{display:grid;gap:12px;padding:6px 0 22px;border-top:1px solid var(--line);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.row{overflow:hidden;padding-top:12px}
.mq{display:flex;gap:12px;width:max-content;animation:slide var(--dur,60s) linear infinite}
.row.rev .mq{animation-direction:reverse}
.rows:hover .mq,.rows:focus-within .mq{animation-play-state:paused}
@keyframes slide{to{transform:translateX(calc(-50% - 6px))}}
.bc{width:min(340px,78vw);flex:none;display:flex;flex-direction:column;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);text-decoration:none;color:var(--fg)}
.bc:hover,.bc:focus-visible{border-color:var(--pink)}
.bc p{margin:0;font-size:17px;line-height:1.35;font-weight:600;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.bc p::before{content:"\201C";color:var(--pink);font-family:var(--display);font-weight:900;margin-right:4px}
.bc .by{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);min-width:0}
.bc .av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:11px;font-weight:800;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.bc .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc .nm b{color:var(--fg);font-weight:700}
.bc .src{margin-left:auto;flex:none;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bc .src.x{color:var(--fg)}.bc .src.pr{color:#ffd166}
@media (prefers-reduced-motion:reduce){.mq{animation:none}.row{overflow-x:auto}.spot-i.in{animation:none}.spot-bar{display:none}}


/* exhibitors: two rows of Steam capsules, top row drifts left, bottom row drifts right */
.exh{display:grid;gap:14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.exh .row{padding:4px 0}
.exh:hover .mq,.exh:focus-within .mq{animation-play-state:paused}
.cap{flex:none;display:block;width:clamp(200px,22vw,276px);aspect-ratio:460/215;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2);position:relative;transition:transform .2s,border-color .2s,box-shadow .2s}
.cap img{display:block;width:100%;height:100%;object-fit:cover}
.cap:hover,.cap:focus-visible{transform:translateY(-3px) scale(1.03);border-color:var(--pink);box-shadow:0 10px 30px -10px #ff3fa488}
.cap span{position:absolute;inset:auto 0 0 0;padding:18px 10px 8px;font-weight:700;font-size:14px;background:linear-gradient(transparent,#000c);opacity:0;transition:opacity .2s}
.cap:hover span,.cap:focus-visible span{opacity:1}


/* quote wall: still masonry grid, filter chips, collapsed until "show all" */
.wall-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px clamp(16px,3vw,24px);border-top:1px solid var(--line)}
.chip{font:inherit;font-weight:700;font-size:15px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer}
.chip b{color:var(--fg);margin-left:4px}
.chip[aria-pressed="true"]{border-color:var(--pink);color:var(--fg);background:var(--pink-soft)}
[hidden]{display:none!important}
.wall-wrap{position:relative;padding-bottom:22px}
.wall{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:calc((100% - 24px)/3);gap:12px;
  overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;
  margin:0 clamp(16px,3vw,24px);cursor:grab}
.wall::-webkit-scrollbar{display:none}
.wall.drag{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
.wall .bc{width:auto;margin:0;scroll-snap-align:start;transition:border-color .2s,box-shadow .2s}
.wall .bc p{-webkit-line-clamp:7;overflow-wrap:anywhere}
.wall .bc.on{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink),0 0 24px -6px var(--pink)}
@media (max-width:900px){.wall{grid-auto-columns:calc((100% - 12px)/2)}}
@media (max-width:560px){.wall{grid-auto-columns:88%}}
.wall-arrow{position:absolute;top:calc(50% - 34px);z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel-2);color:var(--fg);font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px -6px #000a;transition:opacity .2s,border-color .2s}
.wall-arrow:hover{border-color:var(--pink)}
.wall-arrow.prev{left:4px}.wall-arrow.next{right:4px}
.wall-arrow:disabled{opacity:0;pointer-events:none}
.wall-pos{text-align:center;color:var(--faint);font-size:14px;font-weight:600;margin-top:10px}
@media (hover:none){.wall-arrow{display:none}}


/* partner testimonials under the exhibitors */
.tst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px);margin-top:36px}
@media (max-width:900px){.tst{grid-template-columns:minmax(0,1fr)}}
.tst figure{position:relative;margin:0;padding:6px 0 0 30px;display:flex;flex-direction:column;gap:18px}
.tst figure::before{content:"\201C";position:absolute;left:-4px;top:-22px;font-family:var(--display);font-weight:900;font-size:72px;line-height:1;color:var(--faint);opacity:.6}
.tst blockquote{margin:0;font-size:19px;line-height:1.45;font-weight:600;color:var(--fg)}
.tst figcaption{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tst figcaption img{display:block;height:auto;max-height:40px;width:auto}
.tst figcaption span{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}


/* channel decks: one big card per channel, swipe sideways through overview and highlights */
.deck{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--panel);margin-bottom:16px;min-width:0;transition:border-color .2s,box-shadow .2s}
.deck:hover{border-color:var(--brand,var(--line));box-shadow:0 0 0 1px var(--brand,transparent)}
.deck.b-instagram:hover{border-color:transparent;box-shadow:none;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5) border-box}
.deck-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 22px 6px}
.deck-h h3{margin:0;display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:clamp(17px,2vw,22px);letter-spacing:.04em;text-transform:uppercase}
.deck-tabs{display:flex;gap:6px;flex-wrap:wrap}
.deck-tabs button{font:inherit;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer}
.deck-tabs button[aria-current="true"]{border-color:var(--pink);color:var(--fg);background:var(--pink-soft)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;padding:14px 22px 22px;height:500px;overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:16px}
@media (max-width:860px){.slide{height:620px}}
.bars.two{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
@media (max-width:700px){.bars.two{grid-template-columns:minmax(0,1fr)}}
.slide h4{margin:0;font-family:var(--display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dov{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
@media (max-width:860px){.dov{grid-template-columns:minmax(0,1fr)}}
.dov .bignum{font-family:var(--display);font-weight:800;font-size:clamp(40px,6vw,64px);line-height:1}
.dov .bignum small{display:block;font-family:var(--body);font-size:17px;font-weight:600;color:var(--muted);margin-top:6px}
.dov .minis{padding:18px 0 0;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.dov .top3{padding:0;margin:0}
.dov .bars{padding:0}
.slide .cf{padding:0;margin-top:auto}
.embeds{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));align-items:start}
.embeds.one{grid-template-columns:minmax(0,7fr) minmax(0,4fr)}
@media (max-width:860px){.embeds.one{grid-template-columns:minmax(0,1fr)}}
.emb{min-width:0}
.emb .fr{position:relative;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}
.emb .fr.wide{aspect-ratio:16/9}
.emb .fr.tall{aspect-ratio:9/16;height:400px;margin:0 auto}
.emb .fr.ig{height:400px}
.emb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.emb .ecap{display:block;padding:8px 2px 0;text-decoration:none}
.emb .ecap b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emb .ecap span{color:var(--faint);font-size:15px}
.emb-info{display:flex;flex-direction:column;gap:10px}
.emb-info .bignum{font-family:var(--display);font-weight:800;font-size:40px}
.qgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.qgrid .bc{width:auto}
.deck .tw{height:410px}
.deck-arrow{position:absolute;top:50%;z-index:3;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font-size:22px;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px -6px #000a}
.deck-arrow:hover{border-color:var(--pink)}
.deck-arrow.prev{left:-14px}.deck-arrow.next{right:-14px}
.deck-arrow:disabled{opacity:0;pointer-events:none}
@media (max-width:700px){.deck-arrow{display:none}.slide{padding:12px 16px 18px}.deck-h{padding:16px 16px 4px}}


/* twitch deck */
.ktiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:900px){.ktiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.ktiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ktiles.k4{grid-template-columns:repeat(4,minmax(0,1fr))}@media (max-width:520px){.ktiles.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ktile{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:14px 12px;text-align:center}
.ktile span{display:block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ktile b{display:block;margin-top:6px;font-family:var(--display);font-size:clamp(20px,2.4vw,28px)}
.sevs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.sevs{grid-template-columns:1fr}}
.sev{display:grid;gap:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:14px 16px;color:var(--fg);text-decoration:none;transition:border-color .2s}
.sev:hover{border-color:#66c0f4}
.sev .nm{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9fd3ff}
.sev .kv{color:var(--muted);font-size:14px}.sev .kv b{color:var(--fg)}
.sev .gr{font-size:13px;font-weight:700;color:var(--faint)}
.up{color:#3ccf91!important}.dn{color:#ff8a8a!important}
.schs{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}
@media (max-width:760px){.schs{grid-template-columns:1fr}}
.sch{border:1px solid var(--line);border-radius:14px;background:var(--panel-2);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lc{width:100%;flex:1;min-height:0}.lc svg{display:block;width:100%;height:auto;overflow:visible}
.scols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;min-height:200px}
@media (max-width:760px){.scols{min-height:160px}}
.scol{display:flex;flex-direction:column;align-items:center;text-align:center}
.scol b{font-family:var(--display);font-size:clamp(15px,1.8vw,20px)}
.scol em{font-style:normal;font-size:12px;font-weight:800;min-height:16px}
.sbar{flex:1;width:min(64px,70%);display:flex;align-items:flex-end;margin:6px 0 8px;border-bottom:1px solid var(--line)}
.sbar i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:4px}
.scol span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gcard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(120deg,var(--panel) 0%,#3a2f4d 100%);color:var(--fg);transition:border-color .2s}
.gcard:hover{border-color:#66c0f4}
.gcard img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:460/215}
.gbody{padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.gbody h3{margin:0;font-family:var(--display);font-size:24px}
.gbody p{margin:0;color:var(--muted);line-height:1.5}
.gtags{display:flex;flex-wrap:wrap;gap:6px}.gtags span{font-size:12px;padding:4px 9px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.gfoot{margin-top:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.gdate{font-size:13px;color:var(--faint)}
.gbtns{display:flex;gap:8px;flex-wrap:wrap}
.gbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#1a9fff;color:#fff;font-weight:800;font-size:14px}
.gbtn svg{width:18px;height:18px;fill:currentColor}.gbtn{text-decoration:none;transition:filter .2s}.gbtn:hover{filter:brightness(1.15)}.gimg{display:block}
.gbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);cursor:pointer}
@media (max-width:760px){.gcard{grid-template-columns:1fr}.gbody{padding:18px}}
.wvs{border:1px solid var(--line);border-radius:14px;background:var(--panel-2);padding:18px 20px;display:grid;gap:12px}
.wvs p{margin:0;color:var(--muted)}.wvs p b{color:var(--fg)}
.wvs .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wvs .row b{color:var(--fg);letter-spacing:0}
.wvs .bar{height:10px;border-radius:999px;background:var(--bg);overflow:hidden}.wvs .bar i{display:block;height:100%;border-radius:999px;background:#a970ff}
.wvs .bar.g i{background:#199e70;min-width:10px}
.tl{position:relative}
.tl svg{display:block;width:100%;height:auto;overflow:visible}
.tl .tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.tl .tip b{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.lg{display:flex;gap:18px;justify-content:center;font-size:14px;font-weight:600;color:var(--muted)}
.lg i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.langs{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:center}
@media (max-width:860px){.langs{grid-template-columns:minmax(0,1fr)}}
.langs svg{display:block;width:min(100%,300px);margin:0 auto}
.lrow{display:flex;align-items:center;gap:12px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);margin-bottom:6px}
.lrow .code{flex:none;width:30px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.lrow .nm{font-weight:700}.lrow .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}
/* press outlet logos */
.outlets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:900px){.outlets{grid-template-columns:repeat(2,minmax(0,1fr))}}
.outlet{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;text-decoration:none;padding:14px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);min-width:0}
.outlet:hover{border-color:var(--pink)}
.outlet img{width:36px;height:36px;border-radius:9px;background:#fff;padding:4px;object-fit:contain}
.outlet .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.outlet .n{color:var(--muted);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}

/* quotes */
.quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.quotes{grid-template-columns:minmax(0,1fr)}}
.q{margin:0;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;gap:12px}
.q blockquote{margin:0;font-size:21px;font-weight:600;line-height:1.3}
.q blockquote::before{content:"“";font-family:var(--display);color:var(--pink);font-size:30px;line-height:0;vertical-align:-12px;margin-right:4px}
.q cite{font-style:normal;color:var(--muted);font-weight:600;margin-top:auto}

/* panel (deep dive) */
.ov{position:fixed;inset:0;z-index:50;background:#05030bcc;display:flex;justify-content:flex-end}
.ov[hidden]{display:none}
.pn{width:min(860px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pn-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.pn-h h3{margin:0;font-family:var(--display);font-size:20px;letter-spacing:.04em}
.pn-tools{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.pn-tools input,.pn-tools select{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;font:600 16px var(--body)}
.pn-tools input{flex:1 1 220px;min-width:0}
.pn-b{overflow:auto;flex:1;padding-bottom:env(safe-area-inset-bottom,0px)}
table{width:100%;border-collapse:collapse;font-size:16px}
th{position:sticky;top:0;background:var(--bg);text-align:left;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:10px 20px;border-bottom:1px solid var(--line)}
td{padding:9px 20px;border-bottom:1px solid var(--line);vertical-align:top}
td a{text-decoration:none;font-weight:700}
td a:hover{color:var(--pink)}
td .s{display:block;color:var(--faint);font-size:14px;font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:5px;background:var(--panel-2);color:var(--muted);margin-left:6px}

.foot{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:15px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.play{transition:transform .2s}.hl,.btn{transition:border-color .15s}}
</style>

   "quotes": [
    {
     "text": "Endix makes the demo experience feel like it should have always been this simple.",
     "outlet": "Yardbarker",
     "url": "https://www.yardbarker.com/entertainment/articles/join_me_at_endix_may_2026_the_free_digital_gaming_expo_changing_how_we_convention/s1_17456_43875324"
    },
    {
     "text": "The potential, with this level of execution, is insane.",
     "outlet": "Indie-cent Exposure",
     "url": "https://www.indie-exposure.com/top-picks-from-endix-2026/"
    },
    {
     "text": "Endix may offer one of the more unique experiences of the showcase season.",
     "outlet": "Insider Gaming",
     "url": "https://insider-gaming.com/endix-showcase-playable-virtual-gaming-event/"
    },
    {
     "text": "One of the most ambitious and accessible virtual gaming showcases on the internet.",
     "outlet": "Indiecator",
     "url": "https://indiecator.org/2026/05/18/endix-digital-expo-2026-returns-in-may/"
    },
    {
     "text": "It feels like someone mashed up a traditional expo with a multiplayer hub world, and the result is surprisingly immersive.",
     "outlet": "Yardbarker",
     "url": "https://www.yardbarker.com/entertainment/articles/join_me_at_endix_may_2026_the_free_digital_gaming_expo_changing_how_we_convention/s1_17456_43875324"
    },
    {
     "text": "More importantly, it shows what a gaming expo can be.",
     "outlet": "Indie-cent Exposure",
     "url": "https://www.indie-exposure.com/endix-first-impressions/"
    },
    {
     "text": "A virtual gaming expo with huge PlayStation Home energy.",
     "outlet": "GameSpew",
     "url": "https://www.gamespew.com/2026/05/endix-2026/"
    },
    {
     "text": "Each iteration of Endix feels bigger, more polished, and more confident.",
     "outlet": "Yardbarker",
     "url": "https://www.yardbarker.com/entertainment/articles/join_me_at_endix_may_2026_the_free_digital_gaming_expo_changing_how_we_convention/s1_17456_43875324"
    },
    {
     "text": "ENDIX is so good, and honestly, I want to see it grow and frankly, grow with it.",
     "outlet": "Indie-cent Exposure",
     "url": "https://www.indie-exposure.com/top-picks-from-endix-2026/"
    },
    {
     "text": "Endix Is Turning Digital Game Showcases Into a Playable Experience.",
     "outlet": "Insider Gaming",
     "url": "https://insider-gaming.com/endix-showcase-playable-virtual-gaming-event/"
    },
    {
     "text": "The strongest part of ENDIX is the event’s accessibility.",
     "outlet": "Screen Hype",
     "url": "https://www.screenhype.co.uk/endix-2026-the-future-of-gaming-conventions-is-accessible/"
    },
    {
     "text": "It is easy, fast, and surprisingly social.",
     "outlet": "Yardbarker",
     "url": "https://www.yardbarker.com/entertainment/articles/join_me_at_endix_may_2026_the_free_digital_gaming_expo_changing_how_we_convention/s1_17456_43875324"
    },
    {
     "text": "No expensive tickets. No travel. No hotel bookings.",
     "outlet": "Indie-cent Exposure",
     "url": "https://www.indie-exposure.com/endix-first-impressions/"
    },
    {
     "text": "ENDIX absolutely has its own charm.",
     "outlet": "GameSpew",
     "url": "https://www.gamespew.com/2026/05/endix-2026/"
    },
    {
     "text": "The event feels like it is growing in the right direction.",
     "outlet": "Screen Hype",
     "url": "https://www.screenhype.co.uk/endix-2026-the-future-of-gaming-conventions-is-accessible/"
    },
    {
     "text": "ENDIX presents an opportunity for developers and players to interact through digital worlds, and I’m here for it.",
     "outlet": "Indiecator",
     "url": "https://indiecator.org/2026/05/18/endix-digital-expo-2026-returns-in-may/"
    },
    {
     "edition": "spring2026",
     "text": "It’s well worth your time – ENDIX stands out from its peers as a wholly unique indie gaming event and I can’t wait to go back.",
     "outlet": "Kyusai Media",
     "url": "https://kyusaimedia.com/gaming/endix-event-indie-games"
    },
    {
     "edition": "spring2026",
     "text": "Most importantly, ENDIX still offers something rare in the games industry: a genuinely accessible virtual convention space that tries to bring players, creators, press, developers, and publishers together without putting financial barriers in front of people.",
     "outlet": "Screen Hype",
     "url": "https://www.screenhype.co.uk/endix-2026-the-future-of-gaming-conventions-is-accessible/"
    },
    {
     "edition": "spring2026",
     "text": "However, PS Home vibes aside, ENDIX absolutely has its own charm and, rough edges aside, it’s a fun way to explore upcoming titles.",
     "outlet": "GameSpew",
     "url": "https://www.gamespew.com/2026/05/endix-2026/"
    },
    {
     "edition": "spring2026",
     "text": "Whether that approach becomes a larger part of the industry’s future depends on the adoption, but for players looking for something more interactive than another livestream, Endix may offer one of the more unique experiences of the showcase season.",
     "outlet": "Insider Gaming",
     "url": "https://insider-gaming.com/endix-showcase-playable-virtual-gaming-event/"
    },
    {
     "edition": "spring2026",
     "text": "What makes ENDIX so unique is that the team behind it has worked hard to create a virtual world for ENDIX that allows players to walk around its video game world in order to see what the future of the gaming industry has in store for them.",
     "outlet": "Thumb Wars",
     "url": "https://thethumbwars.com/endix-is-here-once-again/"
    },
    {
     "edition": "spring2026",
     "text": "Because of this, ENDIX occasionally genuinely feels like walking through a digital convention together with other attendees, something many other online events still completely lack.",
     "outlet": "4-RG Gaming-Magazin",
     "url": "https://4-rg.com/en/gaming/endix-2026-the-digital-gaming-expo"
    },
    {
     "edition": "spring2026",
     "text": "Endix leans into the idea that if we are going to do a digital event, it should feel like a place worth exploring, not just a menu of trailers.",
     "outlet": "Total Apex Entertainment",
     "url": "https://totalapexentertainment.com/join-me-at-endix/"
    },
    {
     "edition": "spring2026",
     "text": "As such, events like ENDIX are amazing to me in the sense that they make both attendance and showcasing very accessible.",
     "outlet": "Indiecator",
     "url": "https://indiecator.org/2026/05/18/endix-digital-expo-2026-returns-in-may/"
    },
    {
     "edition": "spring2026",
     "text": "IGN will also be hosting all of the biggest trailers from ENDIX on IGN.com and our IGN and GameTrailers YouTube channels, so you'll be able to check out this great selection of titles whenever you'd like.",
     "outlet": "IGN",
     "url": "https://www.ign.com/articles/endix-the-fully-free-digital-gaming-expo-is-now-live-with-playable-demos-panels-and-much-more"
    }
   ],

   "testimonials": [
    {
     "text": "I love conventions, but I do love my gamer cave even more. With Endix, I can have both combined! Genuinely such a unique, creative, and fun solution to the question of what the future of game showcases will look like.",
     "name": "Golnaz Eftekhari",
     "company": "THQ Nordic",
     "logo": "assets/logo-thq-nordic.png"
    },
    {
     "text": "To be part of Endix was a great deal of fun, both to be at the booth to meet the fans & on the opening day meeting the press. The idea that you can run a booth at a convention from home is a real game changer, looking forward to seeing how Endix evolves!",
     "name": "Christopher Lewis",
     "company": "Frozen District",
     "logo": "assets/logo-frozen-district.png"
    },
    {
     "text": "Endix Showcase was a genuinely fun and interactive experience. Combined with excellent Alienware visibility and flawless execution, Endix created an engaging environment that kept attendees actively involved throughout the event.",
     "name": "Marek Gabonay",
     "company": "Alienware",
     "logo": "assets/logo-alienware.png"
    }

/* ---------- what people are saying ---------- */
const initials = s => (String(s||"").replace(/[^\p{L}\p{N} ]/gu,"").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("") || "?").toUpperCase();
function buzz(ed){
  const quotes = ed.quotes || [], comments = ed.comments || [];
  if (!quotes.length && !comments.length) return "";
  const punchy = quotes.filter(q => q.text.length <= 130);  // long quotes only scroll in the rows below
  const spot = punchy.length ? punchy.map(q => ({text:q.text, who:q.outlet, url:q.url, link:"Read the article ↗"}))
                             : comments.map(c => ({text:c.text, who:`${c.name} · ${c.handle}`, url:c.url, link:"See the post on X ↗"}));
  const cards = [].concat(
    comments.map(c => `<a class="bc" data-k="x" href="${esc(c.url)}" target="_blank" rel="noopener"><p>${esc(c.text)}</p><span class="by"><span class="av" aria-hidden="true">${esc(initials(c.name))}</span><span class="nm"><b>${esc(c.name)}</b><br>${esc(c.handle)} · ${dfmt(c.date)}</span><span class="src x">on X</span></span></a>`),
    quotes.map(q => `<a class="bc" data-k="press" data-t="${esc(q.text.slice(0,60))}" href="${esc(q.url)}" target="_blank" rel="noopener"><p>${esc(q.text)}</p><span class="by"><span class="nm"><b>${esc(q.outlet)}</b><br>Read the article ↗</span><span class="src pr">Press</span></span></a>`)
  );
  // interleave X and press so both kinds show near the top
  const mixed = []; const xs = cards.slice(0, comments.length), ps = cards.slice(comments.length);
  for (let i = 0; i < Math.max(xs.length, ps.length); i++) { if (xs[i]) mixed.push(xs[i]); if (ps[i]) mixed.push(ps[i]); }
  const chips = [["all","All",mixed.length],["press","Press",quotes.length],["x","Players on X",comments.length]].filter(c => c[2] > 0);
  window.__spot = spot;
  return `<section><div class="sh"><div><h2>What people are saying</h2></div></div>
  <div class="buzz">
    <div class="spot"><span class="qm" aria-hidden="true">“</span>
      <figure class="spot-i" id="spot-i"></figure>
      ${spot.length > 1 ? `<div class="spot-nav" role="group" aria-label="Choose quote">${spot.map((q,i) => `<button type="button" data-q="${i}" aria-label="Quote ${i+1}: ${esc(q.who)}"></button>`).join("")}</div>` : ""}
      <span class="spot-bar" id="spot-bar"></span>
    </div>
    ${chips.length > 2 ? `<div class="wall-bar" role="group" aria-label="Show">${chips.map((c,i) => `<button type="button" class="chip" data-f="${c[0]}" aria-pressed="${i===0}">${c[1]}<b>${c[2]}</b></button>`).join("")}</div>` : `<div class="wall-bar"></div>`}
    <div class="wall-wrap" id="wall-wrap">
      <button type="button" class="wall-arrow prev" id="wall-prev" aria-label="Previous quotes">‹</button>
      <div class="wall" id="wall">${mixed.join("")}</div>
      <button type="button" class="wall-arrow next" id="wall-next" aria-label="More quotes">›</button>
      <div class="wall-pos" id="wall-pos" aria-live="polite"></div>
    </div>
  </div></section>`;
}
let spotTimer = null, spotIdx = 0;
function showSpot(i){
  const spot = window.__spot || [], el = document.getElementById("spot-i");
  if (!el || !spot.length) return;
  spotIdx = (i + spot.length) % spot.length;
  const q = spot[spotIdx];
  el.classList.remove("in"); void el.offsetWidth;
  el.innerHTML = `<blockquote${q.text.length > 140 ? ' class="long"' : ""}>${esc(q.text)}</blockquote><figcaption><span class="who">${esc(q.who)}</span>${q.url ? `<a class="read" href="${esc(q.url)}" target="_blank" rel="noopener">${q.link}</a>` : ""}</figcaption>`;
  el.classList.add("in");
  document.querySelectorAll(".spot-nav button").forEach(b => b.setAttribute("aria-current", String(+b.dataset.q === spotIdx)));
  const key = q.text.slice(0,60);
  document.querySelectorAll("#wall .bc").forEach(c => c.classList.toggle("on", c.dataset.t === key));
  const bar = document.getElementById("spot-bar");
  if (bar) { bar.classList.remove("run"); void bar.offsetWidth; if (spot.length > 1) bar.classList.add("run"); }
}
function startSpot(){
  clearInterval(spotTimer); spotIdx = 0;
  const box = document.querySelector(".buzz");
  if (!box) return;
  showSpot(0);
  document.querySelectorAll(".spot-nav button").forEach(b => b.onclick = () => showSpot(+b.dataset.q));
  const wall = document.getElementById("wall"), prev = document.getElementById("wall-prev"), next = document.getElementById("wall-next"), pos = document.getElementById("wall-pos");
  if (wall) {
    const sync = () => {
      const max = wall.scrollWidth - wall.clientWidth;
      prev.disabled = wall.scrollLeft <= 4; next.disabled = wall.scrollLeft >= max - 4;
      const shown = [...wall.querySelectorAll(".bc:not([hidden])")];
      const cols = Math.ceil(shown.length / 2), colW = wall.scrollWidth / Math.max(cols, 1);
      const first = Math.round(wall.scrollLeft / colW) * 2 + 1, last = Math.min(shown.length, first - 1 + Math.round(wall.clientWidth / colW) * 2);
      pos.textContent = shown.length ? `${first}–${last} of ${shown.length}` : "";
    };
    const page = dir => wall.scrollBy({left: dir * wall.clientWidth, behavior: "smooth"});
    prev.onclick = () => page(-1); next.onclick = () => page(1);
    wall.addEventListener("scroll", () => requestAnimationFrame(sync), {passive: true});
    window.addEventListener("resize", sync);
    // drag with the mouse, like swiping on a phone
    let down = null, moved = false;
    wall.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") return; down = {x: e.clientX, left: wall.scrollLeft}; moved = false; });
    window.addEventListener("pointermove", e => { if (!down) return; const dx = e.clientX - down.x; if (Math.abs(dx) > 5) { moved = true; wall.classList.add("drag"); wall.scrollLeft = down.left - dx; } });
    window.addEventListener("pointerup", () => { if (!down) return; down = null; wall.classList.remove("drag"); });
    wall.addEventListener("click", e => { if (moved) { e.preventDefault(); moved = false; } }, true);
    wall.addEventListener("dragstart", e => e.preventDefault());
    document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
      document.querySelectorAll(".chip").forEach(o => o.setAttribute("aria-pressed", String(o === c)));
      wall.querySelectorAll(".bc").forEach(card => { card.hidden = c.dataset.f !== "all" && card.dataset.k !== c.dataset.f; });
      wall.scrollTo({left: 0, behavior: "auto"}); sync();
    });
    sync();
  }
  const bar = document.getElementById("spot-bar");
  if (bar) bar.addEventListener("animationend", () => showSpot(spotIdx + 1));
}

    out.push(deck("twitch", "twitch", "Twitch", [
      ["Overview", `<div class="ktiles">${[["Hours watched", short(t.hours_watched)],["Hours streamed", fmt(t.hours_streamed)],["Average viewers", fmt(t.avg_viewers)],["Viewer ratio", t.viewer_ratio || (t.hours_watched / t.hours_streamed).toFixed(1)],["Max viewers", short(t.peak_viewers)],["Streamers", fmt(t.streamers)]].map(k => `<div class="ktile"><span>${k[0]}</span><b class="num">${k[1]}</b></div>`).join("")}</div>
        <div class="wvs"><h4>Watch vs stream</h4><p>For every hour streamed, viewers watched <b>~${Math.round(t.hours_watched / t.hours_streamed)} hours</b>.</p>
          <div class="row"><span>Hours watched</span><b class="num">${fmt(t.hours_watched)}</b></div><div class="bar"><i style="width:100%"></i></div>
          <div class="row"><span>Hours streamed</span><b class="num">${fmt(t.hours_streamed)}</b></div><div class="bar g"><i style="width:${(t.hours_streamed / t.hours_watched * 100).toFixed(1)}%"></i></div></div>
        <div class="cf">${t.url ? `<span class="note"><a href="${esc(t.url)}" target="_blank" rel="noopener" style="color:inherit">Data from ${esc(t.source)} →</a></span>` : ""}</div>`],
      t.timeline ? ["Viewers over the weekend", `<h4>Peak vs average concurrent viewers across all Endix streams</h4><div class="tl" data-tl='${esc(JSON.stringify(t.timeline))}'></div><div class="lg"><span><i style="background:#a970ff"></i>Peak viewers</span><span><i style="background:#199e70"></i>Average viewers</span></div>`] : null,
      ["Languages", `<div class="langs"><div>${donut(t.languages, LC, totalL, codes)}</div><div>${t.languages.slice(0,8).map((l, i) => `<div class="lrow"><span class="code" style="background:${LC[i]}">${codes[l[0]] || l[0].slice(0,2).toUpperCase()}</span><span class="nm">${esc(l[0])}</span><span class="n">${l[1]} · ${(l[1] / totalL * 100).toFixed(1)}%</span></div>`).join("")}</div></div>`],
    ]));
  } else out.push(deck("twitch", "twitch", "Twitch", [["Overview", `<div class="empty-c">Streams in the Endix category are measured every 15 minutes from the day before the event until two days after.</div>`]]));
  // Steam
  const st = ed.steam;
  if (st) {
    const evs = st.events || [];
    const pct = (a, b) => (b > a ? "+" : "") + ((b / a - 1) * 100).toFixed(1) + "%";
    const cols = (key, color, label) => `<div class="sch"><h4>${label}</h4><div class="lc" data-lc='${esc(JSON.stringify({labels: evs.map(e => e.name.replace("Endix ", "")), vals: evs.map(e => e[key]), color, full: key === "reads"}))}'></div></div>`;
    const evCards = evs.map((e, i) => `<a class="sev" href="${esc(e.url)}" target="_blank" rel="noopener"><span class="nm">${esc(e.name)} →</span><span class="kv"><b class="num">${short(e.impressions)}</b> impressions</span><span class="kv"><b class="num">${fmt(e.reads)}</b> reads</span>${i ? `<span class="gr ${e.reads >= evs[i-1].reads ? "up" : "dn"}">Reads ${pct(evs[i-1].reads, e.reads)} vs ${esc(evs[i-1].name.replace("Endix ", ""))}</span>` : `<span class="gr">First Endix Steam event</span>`}</a>`).join("");
    out.push(deck("steam", "steam", "Steam", [
      ["Overview", `<div class="ktiles k4">${[["Total unique impressions", fmt(st.impressions)],["Total unique reads", fmt(st.reads)],["Steam events", evs.length || null],["Downloads", ed.downloads || null]].filter(k => k[1]).map(k => `<div class="ktile"><span>${k[0]}</span><b class="num">${k[1]}</b></div>`).join("")}</div>
        <div class="wvs"><h4>Growth in unique reads</h4>${st.growth.map(g => `<div class="row"><span>${esc(g[0])}</span><b class="num up">${esc(g[1])}</b></div>`).join("")}</div>
        <div class="sevs">${evCards}</div>
        <div class="cf"><span class="note">${esc(st.note)} Each card opens that event's Steam sale page with all the games.</span></div>`],
      evs.length ? ["Per event", `<div class="schs">${cols("impressions", "#3987e5", "Unique impressions per event")}${cols("reads", "#199e70", "Unique reads per event")}</div>
        <div class="cf"><span class="note">Impressions and reads are shown on separate scales. Percentages compare with the previous event.</span></div>`] : null,
    ]));
  }
  return out.join("");
}

function wireDecks(){
  document.querySelectorAll("[data-deck]").forEach(d => {
    const track = d.querySelector(".slides"), slides = [...d.querySelectorAll(".slide")], tabs = [...d.querySelectorAll(".deck-tabs button")];
    const prev = d.querySelector(".deck-arrow.prev"), next = d.querySelector(".deck-arrow.next");
    let cur = -1;
    const activate = i => {
      if (i === cur) return; cur = i;
      tabs.forEach((b, j) => b.setAttribute("aria-current", String(j === i)));
      if (prev) { prev.disabled = i === 0; next.disabled = i === slides.length - 1; }
      const sl = slides[i];
      sl.querySelectorAll("iframe[data-src]").forEach(f => { f.src = f.dataset.src; f.removeAttribute("data-src"); });
      const lazy = sl.querySelectorAll("blockquote.tw-lazy");
      if (lazy.length) { lazy.forEach(q => q.className = "twitter-tweet"); if (window.twttr && twttr.widgets) twttr.widgets.load(sl); }
    };
    const go = i => track.scrollTo({left: i * track.clientWidth, behavior: "smooth"});
    tabs.forEach((b, i) => b.onclick = () => go(i));
    if (prev) { prev.onclick = () => go(Math.max(0, cur - 1)); next.onclick = () => go(Math.min(slides.length - 1, cur + 1)); }
    track.addEventListener("scroll", () => requestAnimationFrame(() => activate(Math.round(track.scrollLeft / track.clientWidth))), {passive: true});
    activate(0);
  });
}


function donut(langs, colors, total, codes){
  const R = 100, r = 56, cx = 120, cy = 120; let a0 = -Math.PI / 2;
  const segs = langs.slice(0, 8).map((l, i) => {
    const a1 = a0 + l[1] / total * Math.PI * 2, gap = 0.012;
    const s = a0 + gap, e = a1 - gap, large = e - s > Math.PI ? 1 : 0;
    const p = (rad, ang) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)];
    const [x1,y1] = p(R, s), [x2,y2] = p(R, e), [x3,y3] = p(r, e), [x4,y4] = p(r, s);
    const mid = (a0 + a1) / 2, [lx, ly] = p((R + r) / 2, mid);
    const lab = l[1] / total > 0.04 ? `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="800" fill="#fff">${codes[l[0]] || ""}</text>` : "";
    a0 = a1;
    return `<path d="M${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${large} 0 ${x4},${y4} Z" fill="${colors[i]}"><title>${l[0]}: ${l[1]} streams</title></path>${lab}`;
  }).join("");
  return `<svg viewBox="0 0 240 240" role="img" aria-label="Streams by language">${segs}<text x="120" y="114" text-anchor="middle" font-family="Orbitron, sans-serif" font-weight="800" font-size="26" fill="var(--fg)">${total}</text><text x="120" y="138" text-anchor="middle" font-size="12" fill="var(--muted)">streams</text></svg>`;
}
function drawLines(){
  document.querySelectorAll(".lc[data-lc]").forEach(box => {
    if (box.dataset.done) return; box.dataset.done = 1;
    const d = JSON.parse(box.dataset.lc), n = d.vals.length, id = "g" + Math.random().toString(36).slice(2, 8);
    const W = Math.max(280, Math.round(box.clientWidth || 480)), H = Math.max(W < 420 ? 230 : 260, Math.round(box.clientHeight || 0)), L = 44, R = 44, T = 58, B = 56, max = Math.max(...d.vals) * 1.05;
    const X = i => L + i * (W - L - R) / (n - 1), Y = v => T + (H - T - B) * (1 - v / max);
    let line = `M${X(0)},${Y(d.vals[0])}`;
    for (let i = 0; i < n - 1; i++) { const x0 = X(i), x1 = X(i + 1), cx = (x1 - x0) / 2; line += ` C${x0 + cx},${Y(d.vals[i])} ${x1 - cx},${Y(d.vals[i + 1])} ${x1},${Y(d.vals[i + 1])}`; }
    const area = line + ` L${X(n - 1)},${H - B} L${X(0)},${H - B} Z`;
    const val = v => d.full ? fmt(v) : short(v);
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${d.labels.map((l, i) => l + " " + val(d.vals[i])).join(", ")}">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${d.color}" stop-opacity=".4"/><stop offset="1" stop-color="${d.color}" stop-opacity="0"/></linearGradient></defs>
      <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>
      <path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${d.color}" stroke-width="3"/>
      ${d.vals.map((v, i) => { const g = i ? (v / d.vals[i - 1] - 1) * 100 : null; return `<line x1="${X(i)}" x2="${X(i)}" y1="${Y(v)}" y2="${H - B}" stroke="${d.color}" stroke-opacity=".35" stroke-dasharray="3 4"/>
        <circle cx="${X(i)}" cy="${Y(v)}" r="6" fill="${d.color}" stroke="var(--panel-2)" stroke-width="3"/>
        <text x="${X(i)}" y="${Y(v) - (g === null ? 16 : 32)}" text-anchor="middle" font-family="Orbitron, sans-serif" font-weight="800" font-size="${W < 420 ? 13 : 16}" fill="var(--fg)">${val(v)}</text>
        ${g === null ? "" : `<text x="${X(i)}" y="${Y(v) - 14}" text-anchor="middle" font-size="12" font-weight="800" fill="${g >= 0 ? "#3ccf91" : "#ff8a8a"}">${g >= 0 ? "+" : ""}${g.toFixed(1)}%</text>`}
        <text x="${X(i)}" y="${H - B + 22}" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="var(--muted)">${d.labels[i].toUpperCase().split(" ").map((w, k) => `<tspan x="${X(i)}" dy="${k ? 15 : 0}">${w}</tspan>`).join("")}</text>`; }).join("")}
    </svg>`;
  });
}
function drawTimelines(){
  document.querySelectorAll(".tl[data-tl]").forEach(box => {
    if (box.dataset.done) return; box.dataset.done = 1;
    const d = JSON.parse(box.dataset.tl), n = d.labels.length;
    const W = Math.max(320, Math.round(box.clientWidth || 800)), H = W < 600 ? 240 : 300, L = 44, Rr = 12, T = 12, B = 34, max = Math.max(...d.peak) * 1.08, every = W < 600 ? 6 : 2;
    const X = i => L + i * (W - L - Rr) / (n - 1), Y = v => T + (H - T - B) * (1 - v / max);
    const smooth = arr => { let p = `M${X(0)},${Y(arr[0])}`; for (let i = 0; i < n - 1; i++) { const x0 = X(i), x1 = X(i + 1), y0 = Y(arr[i]), y1 = Y(arr[i + 1]), cx = (x1 - x0) / 2; p += ` C${x0 + cx},${y0} ${x1 - cx},${y1} ${x1},${y1}`; } return p; };
    const area = arr => smooth(arr) + ` L${X(n - 1)},${Y(0)} L${X(0)},${Y(0)} Z`;
    const step = max > 2000 ? 700 : 250, ticks = []; for (let v = 0; v <= max; v += step) ticks.push(v);
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Concurrent viewers over the weekend">
      <defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a970ff" stop-opacity=".35"/><stop offset="1" stop-color="#a970ff" stop-opacity="0"/></linearGradient>
      <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#199e70" stop-opacity=".35"/><stop offset="1" stop-color="#199e70" stop-opacity="0"/></linearGradient></defs>
      ${ticks.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="${v ? "3 4" : ""}"/><text x="${L - 8}" y="${Y(v)}" text-anchor="end" dominant-baseline="central" font-size="12" fill="var(--faint)">${short(v)}</text>`).join("")}
      ${d.labels.map((lab, i) => i % every === 0 ? `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" font-size="12" fill="var(--faint)">${lab}</text>` : "").join("")}
      <path d="${area(d.peak)}" fill="url(#gp)"/><path d="${smooth(d.peak)}" fill="none" stroke="#a970ff" stroke-width="2.5"/>
      <path d="${area(d.avg)}" fill="url(#ga)"/><path d="${smooth(d.avg)}" fill="none" stroke="#199e70" stroke-width="2.5"/>
      <line class="cx" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>
      <circle class="dp" r="5" fill="#a970ff" stroke="var(--panel)" stroke-width="2" opacity="0"/><circle class="da" r="5" fill="#199e70" stroke="var(--panel)" stroke-width="2" opacity="0"/>
      <rect x="${L}" y="${T}" width="${W - L - Rr}" height="${H - T - B}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
    const svg = box.querySelector("svg"), tip = box.querySelector(".tip"), cxl = svg.querySelector(".cx"), dp = svg.querySelector(".dp"), da = svg.querySelector(".da");
    const show = e => {
      const pt = svg.getBoundingClientRect(), sx = (e.clientX - pt.left) / pt.width * W;
      const i = Math.max(0, Math.min(n - 1, Math.round((sx - L) / ((W - L - Rr) / (n - 1)))));
      [cxl, dp, da].forEach(el => el.setAttribute("opacity", 1));
      cxl.setAttribute("x1", X(i)); cxl.setAttribute("x2", X(i));
      dp.setAttribute("cx", X(i)); dp.setAttribute("cy", Y(d.peak[i])); da.setAttribute("cx", X(i)); da.setAttribute("cy", Y(d.avg[i]));
      tip.innerHTML = `<b>${d.labels[i]}</b>Peak <strong>${fmt(d.peak[i])}</strong> · Average <strong>${fmt(d.avg[i])}</strong>`;
      tip.style.left = (X(i) / W * 100) + "%"; tip.style.top = (Y(d.peak[i]) / H * 100) + "%"; tip.style.opacity = 1;
    };
    const hide = () => { [cxl, dp, da].forEach(el => el.setAttribute("opacity", 0)); tip.style.opacity = 0; };
    svg.querySelector(".hit").addEventListener("pointermove", show);
    svg.querySelector(".hit").addEventListener("pointerleave", hide);
  });
}

/* ---------- deep-dive panel ---------- */
let current = null;
function wire(ed){
  current = ed;
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openPanel(b.dataset.open));
}
const ov = document.getElementById("ov");
document.getElementById("pn-close").onclick = closePanel;
ov.addEventListener("click", e => { if (e.target === ov) closePanel(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !ov.hidden) closePanel(); });
let lastFocus = null;
function closePanel(){ ov.hidden = true; document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); }

function openPanel(kind){
  lastFocus = document.activeElement;
  const ed = current;
  const cfg = {
    youtube: {title:"YouTube creators", rows: ed.youtube.filter(v => v.category==="creator"), cols:[["Video", v => `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a><span class="s">${esc(v.channel)} · ${dfmt(v.date)}${v.type==="live"?'<span class="tag">Live</span>':v.type==="short"?'<span class="tag">Short</span>':""}</span>`],["Views", v => fmt(v.views), "r"]],
              filter: [["all","All formats"],["video","Videos"],["short","Shorts"],["live","Livestreams"]], fkey:"type", text: v => v.title+" "+v.channel},
    media: {title:"Trailers & media", rows: ed.youtube.filter(v => v.category!=="creator").map(v => ({...v, src:"YouTube"})).concat(ed.trailer_pages.map(t => ({title:t.headline, channel:t.outlet, url:t.url, date:t.date, views:t.x_views||0, src:"IGN site"}))),
              cols:[["Trailer", v => `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a><span class="s">${esc(v.channel)}${v.date?" · "+dfmt(v.date):""}<span class="tag">${esc(v.src)}</span></span>`],["Views", v => v.views ? fmt(v.views) : "–", "r"]],
              filter: [["all","All"],["YouTube","YouTube"],["IGN site","IGN sites"]], fkey:"src", text: v => v.title+" "+v.channel},
    tiktok: {title:"TikTok", rows: ed.tiktok, cols:[["Video", v => `<a href="${esc(v.url)}" target="_blank" rel="noopener">@${esc(v.creator)}</a><span class="s">${esc(v.caption)} · ${dfmt(v.date)}</span>`],["Views", v => fmt(v.views), "r"]], text: v => v.creator+" "+v.caption},
    instagram: {title:"Instagram", rows: ed.instagram, cols:[["Reel", v => `<a href="${esc(v.url)}" target="_blank" rel="noopener">@${esc(v.creator)}</a><span class="s">${esc(v.caption)} · ${dfmt(v.date)}</span>`],["Views", v => fmt(v.views), "r"]], text: v => v.creator+" "+v.caption},
    x: {title:"Top mentions on X", rows: (ed.x||{}).top||[], cols:[["Post", v => `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.author)}</a><span class="s">${esc(v.summary)} · ${dfmt(v.date)}</span>`],["Views", v => fmt(v.views), "r"]], text: v => v.author+" "+v.summary},
    press: {title:"Press coverage", rows: ed.press.slice().sort((a,b) => (b.uvm||0)-(a.uvm||0)), cols:[["Article", p => `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.headline)}</a><span class="s">${esc(p.outlet)}${p.date?" · "+dfmt(p.date):""} · ${esc(p.language)}${p.uvm?" · "+short(p.uvm)+" monthly visitors":""}${p.kind!=="article"?`<span class="tag">${esc(p.kind)}</span>`:""}</span>`],["Country", p => esc(p.country), "r"]],
            filter: [["all","All countries"]].concat([...new Set(ed.press.map(p=>p.country))].sort().map(c=>[c,c])), fkey:"country", text: p => p.headline+" "+p.outlet},
  }[kind];
  document.getElementById("pn-title").textContent = `${cfg.title} · ${ed.name}`;
  const tools = document.getElementById("pn-tools");
  tools.innerHTML = `<input id="pn-q" type="search" placeholder="Search" aria-label="Search">${cfg.filter ? `<select id="pn-f" aria-label="Filter">${cfg.filter.map(f => `<option value="${esc(f[0])}">${esc(f[1])}</option>`).join("")}</select>` : ""}`;
  const draw = () => {
    const q = (document.getElementById("pn-q").value || "").toLowerCase();
    const f = cfg.filter ? document.getElementById("pn-f").value : "all";
    const rows = cfg.rows.filter(r => (f === "all" || r[cfg.fkey] === f) && (!q || cfg.text(r).toLowerCase().includes(q)));
    document.getElementById("pn-b").innerHTML = `<table><thead><tr>${cfg.cols.map(c => `<th class="${c[2]||""}">${c[0]}</th>`).join("")}</tr></thead><tbody>${
      rows.map(r => `<tr>${cfg.cols.map(c => `<td class="${c[2]||""}">${c[1](r)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cfg.cols.length}" style="color:var(--muted)">Nothing matches that search.</td></tr>`
    }</tbody></table>`;
  };
  document.getElementById("pn-q").oninput = draw;
  if (cfg.filter) document.getElementById("pn-f").onchange = draw;
  draw();
  ov.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("pn-close").focus();
}

window.addEventListener("hashchange", () => { render(); window.scrollTo({top:0}); });
render();
</script>
